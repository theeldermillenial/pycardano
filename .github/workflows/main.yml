name: Build

on:
  push:
    branches: "**"
  pull_request:
    branches: ["main", "chang"]
    types: [opened, reopened, edited, synchronize]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'poetry'
      - name: Install dependencies
        run: |
          poetry install
      - name: Run unit tests
        run: |
          poetry run pytest --doctest-modules --ignore=examples --cov=pycardano --cov-config=.coveragerc --cov-report=xml
      - name: "Upload coverage to Codecov"
        if: ${{ matrix.python-version == '3.13' }}
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN || '' }}
      - name: Run static analyses
        if: ${{ matrix.python-version == '3.13' }}
        run: |
          make qa

  build-cbor2-array-hook:
    # The unit tests again on the cbor2 fork that provides ``array_hook``, so the
    # decoder it enables is exercised as well as the stock-cbor2 fallback above.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'poetry'
      - name: Install dependencies
        run: |
          poetry install
          poetry run pip install "cbor2 @ git+https://github.com/theeldermillenial/cbor2.git@6.1.4.post1"
      - name: Check the array_hook decoder is active
        run: |
          poetry run python -c "import pycardano.serialization as s; assert s.loads is s._loads_array_hook"
      - name: Run unit tests
        run: |
          poetry run pytest --doctest-modules --ignore=examples

  continuous-integration:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.13']

    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'poetry'

      - name: Setup docker-compose
        uses: KengoTODA/actions-setup-docker-compose@v1.2.2
        with:
          version: '2.14.2'

      - name: Run integration tests
        run: |
          cd integration-test && ./run_tests.sh

      - name: "Upload coverage to Codecov"
        if: ${{ matrix.python-version == '3.13' }}
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN || '' }}

      - name: Dump docker logs
        if: failure()
        run: |
          cd integration-test && docker compose logs --no-color > integration-test.log

      - name: Upload integration-test.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test.log
          path: integration-test/integration-test.log
